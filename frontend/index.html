<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Assistant</title>

<!-- Markdown renderer -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    height: 100vh;
    display: flex;
  }

  /* ---------- Auth ---------- */

  #auth-screen {
    margin: auto;
    width: 320px;
    padding: 24px;
    border: 1px solid #ddd;
    border-radius: 8px;
  }

  #auth-screen input {
    width: 100%;
    padding: 8px;
    margin: 6px 0;
  }

  #auth-screen button {
    width: 100%;
    padding: 8px;
    margin-top: 8px;
    cursor: pointer;
  }

  #auth-error {
    color: #c0392b;
    font-size: 13px;
    min-height: 18px;
  }

  #auth-toggle {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    cursor: pointer;
    color: #2980b9;
  }

  /* ---------- App ---------- */

  #app {
    display: none;
    width: 100%;
    height: 100%;
  }

  #app.visible {
    display: flex;
  }

  /* ---------- Sidebar ---------- */

  #sidebar {
    width: 260px;
    border-right: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    padding: 10px;
  }

  #new-chat-btn {
    background-color: #c1c2c2;
    padding: 10px;
    margin-bottom: 10px;
    cursor: pointer;
  }

  #conversation-list {
    flex: 1;
    overflow-y: auto;
  }

  .conv-item {
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .conv-item:hover {
    background: #f0f0f0;
  }

  .conv-item.active {
    background: #e0e0e0;
    font-weight: 600;
  }

  .conv-item-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .conv-delete-btn {
    border: none;
    background: none;
    color: #999;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .conv-delete-btn:hover {
    background: #e0b4b4;
    color: #c0392b;
  }

  /* ---------- Main ---------- */

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  .msg {
    margin-bottom: 14px;
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 10px;
  }

  .msg.user {
    background: #f8afd3;
    margin-left: auto;
    white-space: pre-wrap;

    direction: rtl;
    text-align: right;
  }

  .msg.assistant {
    background: #f1f1f1;
    margin-right: auto;
    line-height: 1.5;
  }

  .msg.status {
    background: none;
    color: #888;
    font-size: 13px;
    font-style: italic;
    padding: 0;
  }

  /* ---------- Markdown ---------- */

  .msg.assistant p {
    margin: 0 0 10px 0;
  }

  .msg.assistant p:last-child {
    margin-bottom: 0;
  }

  .msg.assistant h1,
  .msg.assistant h2,
  .msg.assistant h3,
  .msg.assistant h4 {
    margin-top: 12px;
    margin-bottom: 8px;
  }

  .msg.assistant ul,
  .msg.assistant ol {
    margin-top: 6px;
    margin-bottom: 10px;
    padding-left: 24px;
  }

  .msg.assistant li {
    margin-bottom: 4px;
  }

  /* Tables */

  .msg.assistant table {
    border-collapse: collapse;
    width: 100%;
    margin: 12px 0;
    font-size: 14px;
  }

  .msg.assistant th,
  .msg.assistant td {
    border: 1px solid #ccc;
    padding: 8px 10px;
    text-align: left;
  }

  .msg.assistant th {
    font-weight: 600;
    background: #e8e8e8;
  }

  /* Code */

  .msg.assistant code {
    background: #e5e5e5;
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 0.9em;
  }

  .msg.assistant pre {
    background: #222;
    color: #fff;
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
  }

  .msg.assistant pre code {
    background: none;
    padding: 0;
  }

  /* Links */

  .msg.assistant a {
    color: #2980b9;
  }

  /* ---------- Input ---------- */

  #input-bar {
    display: flex;
    padding: 14px;
    border-top: 1px solid #ddd;
  }

  #input-bar input {
    flex: 1;
    padding: 10px;
  }

  #input-bar button {
    padding: 10px 18px;
    margin-left: 8px;
    cursor: pointer;
  }
</style>
</head>

<body>

<!-- =========================
     AUTH SCREEN
========================= -->

<div id="auth-screen">
  <h2 id="auth-title">Log in</h2>

  <input
    id="auth-email"
    type="email"
    placeholder="Email"
  >

  <input
    id="auth-password"
    type="password"
    placeholder="Password"
  >

  <button id="auth-submit">
    Log in
  </button>

  <div id="auth-error"></div>

  <div id="auth-toggle">
    Don't have an account? Register
  </div>
</div>


<!-- =========================
     MAIN APP
========================= -->

<div id="app">

  <!-- Sidebar -->
  <div id="sidebar">

    <button id="new-chat-btn">
      + New Chat
    </button>

    <div id="conversation-list"></div>

  </div>


  <!-- Main -->
  <div id="main">

    <div id="messages"></div>

    <div id="input-bar">

      <input
        id="message-input"
        type="text"
        placeholder="Type a message..."
      >

      <button id="send-btn">
        Send
      </button>

    </div>

  </div>

</div>


<script>

const API_BASE = "http://localhost:8000";

/*
 * Shown locally (not persisted to the backend)
 * whenever a conversation has no messages yet.
 */
const WELCOME_MESSAGE =
  "Hi! I'm your travel assistant ✈️ — where are you thinking of going, and when? Tell me a bit about the trip (destination, dates, budget, interests) and I'll help you plan it.";

let accessToken =
  localStorage.getItem("access_token") || null;

let currentConversationId = null;

let isRegisterMode = false;


/* =========================
   DOM ELEMENTS
========================= */

const authScreen =
  document.getElementById("auth-screen");

const app =
  document.getElementById("app");

const authTitle =
  document.getElementById("auth-title");

const authSubmit =
  document.getElementById("auth-submit");

const authToggle =
  document.getElementById("auth-toggle");

const authError =
  document.getElementById("auth-error");

const conversationList =
  document.getElementById("conversation-list");

const messagesEl =
  document.getElementById("messages");

const messageInput =
  document.getElementById("message-input");


/* =========================
   MARKDOWN
========================= */

marked.setOptions({
  gfm: true,
  breaks: true
});


function renderMarkdown(content) {
  return marked.parse(content || "");
}


/* =========================
   AUTH
========================= */

authToggle.onclick = () => {

  isRegisterMode = !isRegisterMode;

  authTitle.textContent =
    isRegisterMode ? "Register" : "Log in";

  authSubmit.textContent =
    isRegisterMode ? "Register" : "Log in";

  authToggle.textContent =
    isRegisterMode
      ? "Already have an account? Log in"
      : "Don't have an account? Register";

  authError.textContent = "";
};


authSubmit.onclick = async () => {

  const email =
    document.getElementById("auth-email").value.trim();

  const password =
    document.getElementById("auth-password").value;

  authError.textContent = "";


  if (!email || !password) {

    authError.textContent =
      "Email and password are required.";

    return;
  }


  const endpoint =
    isRegisterMode
      ? "/auth/register"
      : "/auth/login";


  try {

    const res = await fetch(
      API_BASE + endpoint,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email,
          password
        }),
      }
    );


    if (!res.ok) {

      const err =
        await res.json().catch(() => ({}));

      authError.textContent =
        err.detail || "Authentication failed.";

      return;
    }


    const data =
      await res.json();


    accessToken =
      data.access_token;


    localStorage.setItem(
      "access_token",
      accessToken
    );


    localStorage.setItem(
      "refresh_token",
      data.refresh_token
    );


    await enterApp();

  } catch (e) {

    authError.textContent =
      "Could not reach the server.";
  }
};


/* =========================
   AUTHENTICATED FETCH
========================= */

async function authedFetch(
  path,
  options = {}
) {

  const res = await fetch(
    API_BASE + path,
    {
      ...options,

      headers: {
        ...(options.headers || {}),

        Authorization:
          `Bearer ${accessToken}`,
      },
    }
  );


  if (res.status === 401) {

    logout();

    throw new Error(
      "Session expired"
    );
  }


  return res;
}


/* =========================
   LOGOUT
========================= */

function logout() {

  accessToken = null;

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "refresh_token"
  );


  app.classList.remove(
    "visible"
  );

  authScreen.style.display =
    "block";
}


/* =========================
   APP BOOTSTRAP
========================= */

async function enterApp() {

  try {

    const res =
      await authedFetch(
        "/auth/me"
      );


    if (!res.ok) {
      throw new Error();
    }

  } catch {

    logout();

    return;
  }


  authScreen.style.display =
    "none";

  app.classList.add(
    "visible"
  );


  await loadConversations();
}


/* =========================
   CONVERSATIONS
========================= */

async function loadConversations() {

  const res =
    await authedFetch(
      "/conversations"
    );


  const conversations =
    await res.json();


  conversationList.innerHTML = "";


  conversations.forEach(
    (conv) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "conv-item" +
        (
          conv.id === currentConversationId
            ? " active"
            : ""
        );


      const titleSpan =
        document.createElement(
          "span"
        );

      titleSpan.className =
        "conv-item-title";

      titleSpan.textContent =
        conv.title ||
        "New conversation";


      const deleteBtn =
        document.createElement(
          "button"
        );

      deleteBtn.className =
        "conv-delete-btn";

      deleteBtn.textContent =
        "×";

      deleteBtn.title =
        "Delete conversation";

      deleteBtn.onclick = (e) => {

        e.stopPropagation();

        deleteConversation(
          conv.id
        );
      };


      item.appendChild(titleSpan);
      item.appendChild(deleteBtn);


      item.onclick = () =>
        selectConversation(
          conv.id
        );


      conversationList.appendChild(
        item
      );
    }
  );
}


async function selectConversation(id) {

  currentConversationId = id;


  await loadConversations();


  const res =
    await authedFetch(
      `/conversations/${id}`
    );


  const detail =
    await res.json();


  messagesEl.innerHTML = "";


  if (detail.messages.length === 0) {

    appendMessage(
      "assistant",
      WELCOME_MESSAGE
    );

  } else {

    detail.messages.forEach(
      (m) =>
        appendMessage(
          m.role,
          m.content
        )
    );
  }
}


/* =========================
   DELETE CONVERSATION
========================= */

async function deleteConversation(id) {

  const confirmed =
    confirm(
      "Delete this conversation? This can't be undone."
    );

  if (!confirmed) {
    return;
  }


  try {

    const res =
      await authedFetch(
        `/conversations/${id}`,
        {
          method: "DELETE"
        }
      );


    if (!res.ok && res.status !== 204) {

      const err =
        await res.json().catch(() => ({}));

      alert(
        err.detail ||
        "Failed to delete conversation."
      );

      return;
    }


    /*
     * If we just deleted the active
     * conversation, clear the chat pane.
     */

    if (id === currentConversationId) {

      currentConversationId = null;

      messagesEl.innerHTML = "";
    }


    await loadConversations();

  } catch (e) {

    alert(
      "Could not reach the server."
    );
  }
}


/* =========================
   NEW CHAT
========================= */

document
  .getElementById("new-chat-btn")
  .onclick = async () => {

    const res =
      await authedFetch(
        "/conversations",
        {
          method: "POST"
        }
      );


    const conv =
      await res.json();


    currentConversationId =
      conv.id;


    messagesEl.innerHTML = "";


    appendMessage(
      "assistant",
      WELCOME_MESSAGE
    );


    await loadConversations();
  };


/* =========================
   MESSAGE RENDERING
========================= */

function appendMessage(
  role,
  content
) {

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "msg " + role;


  if (role === "assistant") {

    div.innerHTML =
      renderMarkdown(content);

  } else {

    div.textContent =
      content;
  }


  messagesEl.appendChild(
    div
  );


  messagesEl.scrollTop =
    messagesEl.scrollHeight;


  return div;
}


/* =========================
   STATUS MESSAGE
========================= */

function appendStatus(text) {

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "msg status";


  div.textContent =
    text;


  messagesEl.appendChild(
    div
  );


  messagesEl.scrollTop =
    messagesEl.scrollHeight;


  return div;
}


/* =========================
   SEND MESSAGE
========================= */

document
  .getElementById("send-btn")
  .onclick = sendMessage;


messageInput.addEventListener(
  "keydown",
  (e) => {

    if (e.key === "Enter") {
      sendMessage();
    }

  }
);


/* =========================
   STREAM MESSAGE
========================= */

async function sendMessage() {

  const text =
    messageInput.value.trim();


  if (
    !text ||
    !currentConversationId
  ) {
    return;
  }


  messageInput.value = "";


  /*
   * Immediately display user's message.
   */

  appendMessage(
    "user",
    text
  );


  /*
   * Temporary status message.
   */

  const statusEl =
    appendStatus(
      "Thinking..."
    );


  let assistantEl = null;

  let assistantText = "";


  try {

    const res =
      await authedFetch(
        `/conversations/${currentConversationId}/messages`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            content: text
          }),
        }
      );


    if (!res.ok) {

      const err =
        await res.json().catch(
          () => ({})
        );


      throw new Error(
        err.detail ||
        "Failed to send message."
      );
    }


    const reader =
      res.body.getReader();


    const decoder =
      new TextDecoder();


    let buffer = "";


    while (true) {

      const {
        value,
        done
      } = await reader.read();


      if (done) {
        break;
      }


      buffer +=
        decoder.decode(
          value,
          { stream: true }
        );


      /*
       * SSE events are separated
       * by two newline characters.
       */

      const parts =
        buffer.split("\n\n");


      /*
       * Keep incomplete event
       * for the next chunk.
       */

      buffer =
        parts.pop();


      for (
        const part of parts
      ) {

        if (
          !part.startsWith(
            "data: "
          )
        ) {
          continue;
        }


        const payload =
          JSON.parse(
            part.slice(6)
          );


        /* ---------- Title ---------- */

        if (
          payload.type === "title"
        ) {

          await loadConversations();
        }


        /* ---------- Status ---------- */

        else if (
          payload.type === "status"
        ) {

          statusEl.textContent =
            payload.message;
        }


        /* ---------- Token ---------- */

        else if (
          payload.type === "token"
        ) {

          /*
           * Remove "Thinking..."
           * when the first token arrives.
           */

          if (!assistantEl) {

            statusEl.remove();


            assistantEl =
              appendMessage(
                "assistant",
                ""
              );
          }


          /*
           * Accumulate streamed
           * Markdown.
           */

          assistantText +=
            payload.content;


          /*
           * Render the accumulated
           * Markdown instead of
           * displaying raw Markdown.
           */

          assistantEl.innerHTML =
            renderMarkdown(
              assistantText
            );


          messagesEl.scrollTop =
            messagesEl.scrollHeight;
        }


        /* ---------- Error ---------- */

        else if (
          payload.type === "error"
        ) {

          statusEl.textContent =
            "Error: " +
            payload.message;
        }


        /* ---------- Done ---------- */

        else if (
          payload.type === "done"
        ) {

          /*
           * Stream finished.
           *
           * The complete response
           * has already been rendered.
           */
        }
      }
    }

  } catch (error) {

    /*
     * Remove status if an assistant
     * message has already started.
     */

    if (statusEl.isConnected) {

      statusEl.textContent =
        "Error: " +
        error.message;
    }
  }
}


/* =========================
   INIT
========================= */

if (accessToken) {

  enterApp();
}

</script>

</body>
</html>
